name: Deploy Production to Cloud Run Jobs

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}

      # Step 3: Setup gcloud CLI
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID_PROD }}

      # Step 4: Build Docker image in Cloud Build and push to Artifact Registry
      - name: Build & Push Docker image
        run: |
          gcloud builds submit . \
            --tag us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_PROD }}/warehowz-cron/warehowz-cron-service:production

      # Step 5: Deploy one Cloud Run Job per cron job — same image every time,
      # differing only by the JOB_SLUG env var each job runs with (see
      # index.js / jobs/index.js). `jobs deploy` creates the job on its first
      # run and updates it in place on every push after that. This does NOT
      # create the Cloud Scheduler triggers — those are one-time setup, see
      # README.md.
      - name: Deploy Cloud Run Jobs
        run: |
          IMAGE="us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_PROD }}/warehowz-cron/warehowz-cron-service:production"
          SLUGS="queue-time-tracker buyer-account-check pending-status-check payment-scheduler project-renewal project-expiry"

          for SLUG in $SLUGS; do
            gcloud run jobs deploy "warehowz-cron-$SLUG" \
              --image="$IMAGE" \
              --region=${{ secrets.GCP_REGION_PROD }} \
              --memory=4Gi \
              --task-timeout=1800s \
              --max-retries=3 \
              --set-env-vars="JOB_SLUG=$SLUG,NODE_OPTIONS=--max-old-space-size=3500" \
              --vpc-connector=warehowz-connector \
              --vpc-egress=all-traffic
          done
